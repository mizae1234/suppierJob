    <path d="M44 8 C44 11.8 45.8 13.8 49 14.5 C45.8 15.2 44 17.2 44 21 C44 17.2 42.2 15.2 39 14.5 C42.2 13.8 44 11.8 44 8 Z" fill="url(#goldGrad)"/>
    <circle cx="36" cy="9" r="1.2" fill="#fde047"/>
