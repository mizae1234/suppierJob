      <stop offset="0%" stop-color="#0f5238"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background: Premium Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#34d399" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Graphic Elements -->
  <g>
