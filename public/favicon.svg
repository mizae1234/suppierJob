    <path d="M12 24 L35 24 L35 21 L37 21 L38 27 L47 27 C48.5 27 50 28.2 50.5 29.8 L51.5 33 L51.5 38 C51.5 39.1 50.6 40 49.5 40 L45.8 40 C45.4 37.8 43.4 36 41 36 C38.6 36 36.6 37.8 36.2 40 L24.8 40 C24.4 37.8 22.4 36 20 36 C17.6 36 15.6 37.8 15.2 40 L12 40 C11.4 40 11 39.6 11 39 L11 25 C11 24.4 11.4 24 12 24 Z" fill="#ffffff"/>

